name: Security Audit

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Gate: block on CRITICAL vulnerabilities in PRODUCTION dependencies.
      # Dev-tooling transitive issues (e.g. uuid via @lhci/cli) don't reach
      # the deployed runtime, so they're reported (artifact below), not gating.
      - name: Audit production dependencies (gate)
        run: npm audit --omit=dev --audit-level=critical

      - name: Full audit report (informational)
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e "
            const r = require('./npm-audit-report.json');
            console.log('Full audit summary:', JSON.stringify(r.metadata?.vulnerabilities ?? {}));
          " || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: ignore
          retention-days: 30

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # Isolate e2e from the production database: no DATABASE_URL/DIRECT_URL
      # is passed, so the dev server runs against the committed SQLite
      # dev.db. The specs mock the API routes; unmocked calls hit the local
      # file instead of prod Neon.
      - name: Prepare local SQLite schema
        run: |
          node scripts/prisma-provider-switch.js
          npx prisma db push --skip-generate

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
